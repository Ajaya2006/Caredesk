services:
  - type: web
    name: caredesk
    runtime: python
    plan: free
    region: oregon
    pythonVersion: 3.11.6
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install wheel setuptools
      pip install --only-binary :all: pydantic-core
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: RENDER
        value: true